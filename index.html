<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de lanchas: Time Charter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#ffffff;--surface:#f6f5f1;--text:#1a1a19;--muted:#3d3c38;--faint:#54534d;--border:rgba(11,11,11,0.28);
  --l1:#E1F5EE;--l1b:#0F6E56;--l1t:#085041;
  --l2:#EEEDFE;--l2b:#534AB7;--l2t:#3C3489;
  --l3:#FAEEDA;--l3b:#854F0B;--l3t:#633806;
  --accent:#1a1a19;
  --bandA:#EAE7E0;--bandB:#C4BFB3;
}

*{box-sizing:border-box}
body{margin:0;background:#D3CFC5;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:32px 24px 56px}
h1{font-size:24px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.keys{background:var(--surface);border-radius:12px;padding:16px 20px;margin:0 0 24px}
.keys h2{font-size:15px;font-weight:600;margin:0 0 10px}
.keys ol{margin:0;padding-left:20px}
.keys li{font-size:14px;margin:0 0 8px}
.keys li b{font-weight:600}
.keys li span{display:block;color:var(--muted);font-size:13px}
.ap{display:inline-block;font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin:4px 6px 0 0}
.st{font-size:12px;font-weight:600;color:#27500A;margin:12px 0 0}
.st.bad{color:#A32D2D}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:24px}
.tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:10px 14px;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.desc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:0 0 20px}
.desc div{background:var(--surface);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.desc b{display:block;color:var(--text);font-weight:600;font-size:13px;margin-bottom:2px}
.lg{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 10px;font-size:12px;color:var(--muted)}
.lg span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px}
.ch{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:15px;padding:0 3px;border-radius:4px;font-size:10px;font-weight:600;line-height:1;margin-right:2px}
.cM{background:#3B6D11;color:#EAF3DE;border:0.5px solid #27500A}
.cT{background:#2C2C2A;color:#F1EFE8;border:0.5px solid #888780}
.axrow,.day{display:grid;grid-template-columns:96px 112px minmax(0,1fr);column-gap:10px}
.ax{grid-column:3;position:relative;height:22px;font-size:11px;color:var(--faint)}
.ax span{position:absolute;transform:translateX(-50%)}
.axrow{padding:0 10px}
.day{row-gap:5px;padding:10px;border-radius:10px;margin-bottom:4px;background:var(--bandA)}
.day.alt{background:var(--bandB)}
.dl{grid-row:span 2;display:flex;flex-direction:column;justify-content:center}
.dl b{font-size:14px;font-weight:600}
.dl small{font-size:11px;color:var(--faint)}
.ll{display:flex;flex-direction:column;justify-content:center;border-left:3px solid var(--text);padding-left:8px}
.ll b{font-size:13px;font-weight:600}
.ll small{font-size:11px;color:var(--faint)}
.ll.k2{border-left-color:var(--faint)}
.lane{position:relative;height:54px;border-radius:7px;background:var(--bg);border:1.5px solid rgba(11,11,11,0.35)}
.vl{position:absolute;top:0;bottom:0;border-left:1px solid var(--border)}
.ev{position:absolute;top:3px;bottom:3px;border-radius:6px;font-size:11px;line-height:1.2;padding:2px 6px;overflow:hidden;white-space:nowrap;display:flex;flex-direction:column;justify-content:center;gap:1px}
.ev b{font-weight:600}
.t1{background:var(--l1);border:1.5px solid var(--l1b);color:var(--l1t)}
.t2{background:var(--l2);border:1.5px solid var(--l2b);color:var(--l2t)}
.t1v{background:var(--l1);border:1.5px solid var(--l1b);color:var(--l1t)}
.t2v{background:var(--l2);border:1.5px solid var(--l2b);color:var(--l2t)}
.t3{background:var(--l3);border:1.5px solid var(--l3b);color:var(--l3t)}
.t3v{background:var(--l3);border:1.5px solid var(--l3b);color:var(--l3t)}
.t4{background:#2C2C2A;border:1px solid #444441;color:#F1EFE8}
.t4 .cT{border-color:#F1EFE8}
.t4a{background:repeating-linear-gradient(135deg,rgba(44,44,42,0.16) 0 6px,rgba(44,44,42,0.05) 6px 12px);border:none;color:var(--muted)}


.mt{display:flex;align-items:center;flex-wrap:nowrap}
.px{font-size:10px;font-weight:600;margin-left:2px}
.ev{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.ev.drag{cursor:grabbing;z-index:5;opacity:.92;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ev.clash{outline:2px solid #E24B4A;outline-offset:1px}
.hl,.hr{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
.hl{left:0}.hr{right:0}
.hl:hover,.hr:hover{background:rgba(0,0,0,.12)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px;font-size:12px;color:var(--muted)}
.rst{appearance:none;font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
.rst:hover{background:var(--surface)}
.free{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:24px}
.card{background:var(--surface);border-radius:10px;padding:14px 16px;border:1.5px solid rgba(11,11,11,0.28)}
.card p{margin:0;font-size:12px;color:var(--muted)}
.card b{font-size:24px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
th{font-size:12px;font-weight:600;color:var(--muted)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th.n{text-align:right}
.note{font-size:13px;color:var(--muted);margin-top:16px}
.cons{background:var(--surface);border:1.5px solid rgba(11,11,11,0.28);border-radius:12px;padding:18px 22px;margin:12px 0 8px}
.cons h2{font-size:17px;font-weight:600;margin:0 0 10px}
.cons ul{margin:0;padding-left:22px}
.cons li{font-size:15px;line-height:1.6;color:var(--text);margin:0 0 8px}

.lic{margin-top:36px;padding-top:20px;border-top:2px solid var(--text)}
.lich{font-size:20px;font-weight:600;margin:0}
.card.hi{background:#C0DD97;border-color:#3B6D11}
.card.hi p,.card.hi small{color:#173404}
.card.hi b{color:#173404}
.card small{display:block;font-size:12px;color:var(--muted)}
.calc{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-top:16px;background:var(--surface);border:1.5px solid rgba(11,11,11,0.28);border-radius:10px;padding:14px 16px}
.calc label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.calc input{font:inherit;font-size:18px;font-weight:600;width:180px;padding:8px 10px;border-radius:8px;border:1.5px solid rgba(11,11,11,0.35);background:var(--bg);color:var(--text)}
#tcOut{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
#tcOut b{font-size:18px}
.okc{color:#27500A}.badc{color:#A32D2D}

tr.grp{cursor:pointer}
tr.grp td{font-weight:600}
tr.grp:hover td{background:var(--surface)}
.car{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
tr.grp.open .car{transform:rotate(90deg)}
tr.kid{display:none}
tr.kid.show{display:table-row}
tr.kid td{font-size:13px;color:var(--muted)}
td.ind{padding-left:44px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:12px;padding:16px 18px}
.kpi p{margin:0;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:28px;font-weight:600;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--faint)}
.split{display:flex;height:40px;border-radius:10px;overflow:hidden;gap:2px}
.sp{display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.fT{background:#2C2C2A}.fM{background:#3B6D11}.fC{background:#BA7517}
.dash2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:8px 32px}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.br{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 90px;align-items:center;gap:10px;font-size:13px}
.bl{display:flex;align-items:center;gap:4px;min-width:0}
.bt{position:relative;height:20px;background:var(--surface);border-radius:5px}
.bf{height:100%;border-radius:5px}
.bf.hl{background:#E24B4A}
.ref{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--text);z-index:1}
.bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cX{background:#BA7517;color:#fff;border:0.5px solid #854F0B}
.dd{border:1px solid var(--border);border-radius:10px;padding:0 14px;margin:0 0 10px}
.dd summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;list-style:none}
.dd summary::-webkit-details-marker{display:none}
.dd summary::before{content:'▸';color:var(--muted);margin-right:4px;transition:transform .15s}
.dd[open] summary::before{transform:rotate(90deg)}
.dd summary em{margin-left:auto;font-style:normal;font-weight:400;font-size:13px;color:var(--muted)}
.dd table{margin-bottom:12px}


.ch3{font-size:16px;font-weight:600;margin:32px 0 4px}
td small{font-size:11px;color:var(--muted);margin-left:4px}
.warn{color:#E24B4A;font-weight:600}
tr.tt td{font-weight:600;background:var(--surface);border-top:2px solid var(--text);border-bottom:2px solid var(--text)}
tr.gt td{background:#C0DD97;color:#173404}

@media (max-width:640px){.axrow,.day{grid-template-columns:64px 70px minmax(0,1fr)}.ll small,.dl small{display:none}.ev>span{display:none}}

/* 39: pestaña Línea base y cobertura */
.lbpie{display:flex;align-items:center;gap:16px;flex-wrap:nowrap}
.lbpie>div{min-width:0}
.lbl{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--muted);margin:0 0 10px}
.lbl .sw{margin-top:3px;flex:none}
.lbl b{color:var(--text);font-weight:600}
.lbspot{border:1.5px dashed rgba(11,11,11,0.45);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.lbspot b{color:var(--text)}
.lbfree{background:repeating-linear-gradient(135deg,rgba(44,44,42,0.16) 0 6px,rgba(44,44,42,0.05) 6px 12px)}
.lbb{appearance:none;font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;margin-left:6px}
.lbb:hover{background:var(--surface)}
.lbb.on{background:var(--text);color:#fff;border-color:var(--text)}
.br .bv{white-space:nowrap}
.lbuso{display:flex;flex-direction:column;gap:22px}
.lbuso .note{font-size:15px}
.lbuso .bars{gap:14px;margin-top:12px}
.lbuso .br{grid-template-columns:minmax(200px,1fr) 4fr 130px;font-size:16px;gap:14px}
.lbuso .bt,.lbuso .bf{height:48px;border-radius:7px}
.lbedit{background:var(--surface);border:1.5px solid rgba(11,11,11,0.28);border-radius:10px;padding:10px 14px;margin:20px 0 0}
.lbbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.lbbar b{color:var(--text)}
.lbb.lbdel{background:#A32D2D;color:#fff;border-color:#A32D2D}
.lbmsg{margin-top:8px;font-size:13px;font-weight:600;color:#A32D2D}
.lbform{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.lbform label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.lbform select,.lbform input{font:inherit;font-size:13px;padding:6px 8px;border-radius:7px;border:1px solid rgba(11,11,11,0.35);background:var(--bg);color:var(--text)}
.lbform input[type=number]{width:80px}
.lbform label.lbck{flex-direction:row;align-items:center;gap:6px;padding-bottom:7px}
.lbbtns{display:flex;margin-left:auto}
.lbt{font-size:13px;min-width:760px}
.lbt th,.lbt td{padding:6px 8px;vertical-align:top}
.lbt th{white-space:normal;line-height:1.25}
.lbt .lbd{text-align:center;width:40px;color:var(--text)}
.lbt td.ind{padding-left:20px}
.lbt tr.lbtk td{border-bottom:none;padding-bottom:2px}
.lbt tr.lblec td{font-size:12px;color:var(--muted);padding-top:0;padding-bottom:10px}
.lbt tr.lblec span{color:var(--faint);margin-left:6px}

/* Pestaña Modelo en tamaño grande */
.mkpi{grid-template-columns:repeat(2,minmax(0,1fr))}
.mkpi .card b{display:block;margin:4px 0 2px}
.mkpi .dlt{font-weight:700;color:#0F6E56}
.big .mkpi .card b{font-size:40px}
.mdds{margin-top:24px}
.mddb{padding:4px 0 16px}
.big .dd.mdd summary{font-size:19px;padding:16px 0}
.big .dd.mdd summary em{font-size:16px}
.big .mdd .lg{font-size:14px}
.prf.rec{gap:1.4vw}
.prf.rec .cx{font-size:clamp(22px,1.95vw,36px);padding:4vh 2vw 2vh;gap:.4vh;justify-content:flex-start}
.prf.rec .cx .nn{font-size:clamp(40px,3.4vw,64px)}
.prf.rec .cx small{font-size:.66em;margin-top:1vh}
.rec3 .cx{justify-content:center;padding:5vh 2.2vw}
.rec3 .cx small{font-size:.7em}
.faint{color:var(--faint)}
.mdd .lic{margin-top:0;padding-top:0;border-top:none}
.night{position:absolute;top:0;bottom:0;right:0;background:rgba(44,44,42,.07);border-radius:0 6px 6px 0;pointer-events:none}
.vl.v18{border-left:1.5px dashed rgba(11,11,11,.35)}
.swn{background:rgba(44,44,42,.14);border:1px dashed rgba(11,11,11,.35)}
.eM{background:#BCDF9C;border:1.5px solid #3B6D11;color:#173404}
.eT{background:#D3D1CA;border:1.5px solid #2C2C2A;color:#1F1F1D}
.eMT{background:linear-gradient(90deg,#BCDF9C 0 50%,#D3D1CA 50% 100%);border:1.5px solid #2C2C2A;color:#1F1F1D}
.lgx{align-items:center}
.colby{display:inline-flex;align-items:center;gap:0;margin-right:10px}
.colby .cbl{font-weight:600;color:var(--text);margin-right:6px}
.colby .lbb{margin-left:0;border-radius:0}
.colby .lbb:first-of-type{border-radius:8px 0 0 8px}
.colby .lbb:last-of-type{border-radius:0 8px 8px 0;border-left:none}
.colby .lbb.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tabs{position:sticky;top:0;z-index:30;background:#D3CFC5;padding-top:6px}
.wrap>h1{scroll-snap-align:start}
html.snap .sl{scroll-margin-top:56px}
@media (max-width:900px),(hover:none){html.snap{scroll-snap-type:none}}
@media (max-width:900px){.wrap.big #view{overflow-x:auto}.big .axrow,.big .day{min-width:980px;grid-template-columns:90px 120px minmax(0,1fr)}.big .ev>span{display:block}.big .ll small,.big .dl small{display:block}}
.tabs{transition:transform .25s ease}
.tabs.hid{transform:translateY(-110%)}
.pbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pgo{appearance:none;font:inherit;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;border:none;cursor:pointer;color:#04342C;background:linear-gradient(90deg,#5DCAA5,#C0DD97)}
.pexit{display:none}
html.pmode,html.pmode body{background:#0d1512}
html.pmode{scroll-snap-type:y mandatory}
html.pmode .wrap{max-width:none;padding:0}
html.pmode .wrap>h1,html.pmode #hsub,html.pmode .tabs,html.pmode #st,html.pmode .pbar{display:none}
html.pmode .pres{gap:0}
html.pmode .sl{min-height:100vh;border-radius:0;scroll-snap-align:start;scroll-margin-top:0}
html.pmode .pexit{display:block;position:fixed;top:14px;right:16px;z-index:50;appearance:none;font:600 13px Inter,sans-serif;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:rgba(255,255,255,.75);cursor:pointer;opacity:.35;transition:opacity .2s}
html.pmode .pexit:hover{opacity:1}
.nn .unit{font-size:.36em;letter-spacing:0;margin-left:.08em;font-weight:700}
.chs .col{gap:2vh;padding:3vh 2vw}
.dnw svg{max-height:32vh}
.dnl{gap:1.8vh}
.dnl b{font-size:1.6em}
.lgd{font-size:clamp(16px,1.35vw,24px)}
.mny{font-size:1.3em;font-weight:800;color:#C0DD97}
.sl.s4{gap:2.4vh;padding-top:5vh;padding-bottom:7vh}
.s4 .dnw svg{max-height:28vh}
.s4 .chs .col{padding:2.2vh 2vw;gap:1vh}
.s4 .chs h3{font-size:clamp(18px,1.5vw,28px)}
.s4 .kp3 .cx{padding:2.4vh 2vw}
.pill.pl2{text-transform:none;letter-spacing:.01em;font-size:1em;margin-left:.6em;vertical-align:.05em}
.pill{display:inline-block;margin-left:.5em;padding:.15em .7em;border-radius:999px;font-weight:800;font-size:.9em;color:#3a2203;background:#EF9F27;letter-spacing:.01em}
.efi{border-radius:18px;padding:2vh 1.4vw;background:rgba(192,221,151,.08);border:1.5px solid rgba(192,221,151,.45);display:flex;flex-direction:column;gap:1.2vh}
.efi .et{font-size:clamp(14px,1.1vw,20px);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#C0DD97}
.erow{display:flex;align-items:flex-end;gap:1.4vw}
.erow>div{display:flex;flex-direction:column}
.erow small{font-size:clamp(13px,1vw,18px);color:rgba(241,239,232,.7);font-weight:600}
.erow b{font-size:clamp(26px,2.4vw,44px);font-weight:900;line-height:1.05;color:#F1EFE8}
.erow em{font-style:normal;font-size:clamp(12px,.95vw,17px);color:rgba(241,239,232,.6)}
.erow i{font-style:normal;font-size:clamp(22px,2vw,36px);color:rgba(241,239,232,.5);padding-bottom:.6vh}
.erow .eok{margin-left:auto;text-align:right}
.erow .eok b{color:#C0DD97}
.cvs .heros{font-size:clamp(20px,1.85vw,34px)}
.cvs .rng{font-size:clamp(64px,6vw,116px)}
.cvtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:3vw;align-items:center;flex:1}
.cvh{display:flex;flex-direction:column;gap:2.4vh}
.big90{font-size:clamp(120px,13vw,250px);font-weight:900;line-height:.85;letter-spacing:-.05em;background:linear-gradient(135deg,var(--ac1),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cvh p{margin:0;font-size:clamp(24px,2.2vw,40px);font-weight:600;line-height:1.25;color:#F1EFE8}

function renderTareas(){
 ['.keys','#hsub','#st'].forEach(q=>{const el=document.querySelector(q);if(el)el.style.display='none';});
 const R=LB_TAREAS.filter(r=>!['Sin tarea registrada','Contratistas de TT'].includes(r.departamento)),   // Yelko, 17 nov 2026: sin viajes sin tarea anotada (2) ni personal contratista (4, un solo evento)
 DI=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
 const nf=(v,d=1)=>Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
 const HT=LB_TAREAS.reduce((x,r)=>x+r.horas_sem,0);   // total general de TT (incluye las 2 filas ocultas), igual que 49_peso_tareas_tt.py
 const BL=['Línea base','Variable programable','Variable a pedido'];
 const tot=R.reduce((s,r)=>s+r.total,0);
 const cell=(r,d)=>{const v=r['d_'+d],sh=r.total?v/r.total:0,a=Math.min(1,sh/0.4),tip=r.dias_tipicos.split(', ').includes(d);
  return `<td class="n lbd" style="background:rgba(15,110,86,${(a*0.45).toFixed(2)});${tip?'font-weight:700;':''}" title="${r.tarea}, ${d}: ${v} de ${r.total} (${nf(sh*100)}%)">${v||''}</td>`;};
 const row=r=>`<tr class="lbtk"><td class="ind"><b>${r.tarea}</b></td><td>${r.esquema}</td><td class="n">${nf(r.horas_sem,r.horas_sem<0.1?2:1)}</td><td class="n">${nf(r.horas_sem/HT*100,1)}%</td></tr><tr class="lblec"><td class="ind" colspan="4">${r.lectura} <span>Días típicos: ${r.dias_tipicos}.</span></td></tr>`;
 let body='';
 BL.forEach(b=>{const rs=R.filter(r=>r.bloque===b);if(!rs.length)return;
  body+=`<tr class="tt"><td colspan="4">${b}: ${nf(LB_TAREAS.filter(r=>r.bloque===b).reduce((x,r)=>x+r.horas_sem,0)/HT*100,1)}% de las horas</td></tr>`;
  body+=[...rs].sort((a,b)=>b.total-a.total).map(row).join('');});   // Yelko, 17 nov 2026: solo los títulos de bloque, sin subtítulos por departamento
 return `<p class="sub" style="margin:0 0 8px">Trader Tanker, Balboa · 51 semanas (4 ago 2025 a 26 jul 2026) · ${tot.toLocaleString('en-US')} tareas generadas en los barcos: aprox. ${nf(tot/51,0)} por semana y ${nf(tot/51*365/7/12,0)} por mes · ${nf(R.reduce((x,r)=>x+r.horas_sem,0),1)} h de lancha por semana (las horas de cada viaje se reparten en partes iguales entre sus tareas)</p>
 <div style="overflow-x:auto"><table class="lbt"><thead><tr><th>Tarea</th><th>Esquema</th><th class="n">Horas de lancha por semana</th><th class="n">% de las horas</th></tr></thead><tbody>${body}</tbody></table></div>
`;
}

// 39c. Cálculo en vivo (pedido de Yelko, 17 nov 2026): la semana base, el uso de las lanchas y la cobertura se recalculan
// con los bloques actuales de Opción 1 y Opción 2. Misma regla que los scripts 35, 36 y 37 (comprobado en 44_visitas_para_pagina.py):
// - se cuentan los bloques no opcionales; horas = fin - inicio; personas = las del bloque;
// - semana: bloques de Melones a MOTI, de Melones + TT mitad y mitad (10 puestos de cada una), el resto a TT;
// - cobertura: simulación día por día de las visitas reales de TT (LB_VIS). Cada día, en este orden: Materiales (puestos del bloque,
//   hasta 5 barcazas, primero lo que usa grúa y los suministros); Relevo TT (toda la tripulación del día y los puestos sobre 38, hasta 7 barcazas);
//   rondas de mañana y tarde (puestos menos 10 de Melones, hasta 6 barcazas); Ronda mediodía (puestos del bloque, hasta 3 barcazas en L1 y 4 en L2).
//   El traspaso de materiales y equipos entre barcazas lo hace la lancha de la ronda del día: no ocupa puesto ni suma barcazas.
//   Lo que no cabe pasa al día siguiente con prioridad. Los bloques "Otro" no cambian la cobertura.
// - cuadro de cobertura (cob2): una fila por tarea; relevo, materiales y comida al 100% por definición de Yelko (van en su bloque fijo).
const COB_CONT_MOTI=90;   // cobertura asumida de contratistas MOTI (variable), pedido de Esteban 18 nov 2026

const LB_POR=(()=>{const p=[];LB_VIS.rows.forEach((v,i)=>{if(!v.k)(p[v.o]=p[v.o]||[]).push(i);});return p;})();
const LB_CACHE={};
function lbEv(pl,k){return (pl[k]||[]).filter(e=>!e[6]);}
function lbCalc(mi){

   const pico=Math.max(0,...m.plan.map(pl=>pack(lbEv(pl,'t')).length));let dos=0;m.plan.forEach(pl=>{const r=pack(lbEv(pl,'t'));r.slice(1).forEach(x=>x.forEach(e=>{dos+=e[1]-e[0];}));});
   return {lancha:'Viajes',viajes_sem:ev.length,horas_sem:h,disponible_sem:126,uso_pct:100*h/126,pico,dos};})()]:[['a','L1 (44 pax)',44],['b','L2 (20 pax + carga)',20]].map(([k,lan,cap])=>{const ev=m.plan.flatMap(pl=>lbEv(pl,k));
  const h=ev.reduce((s,e)=>s+e[1]-e[0],0),ph=ev.reduce((s,e)=>s+(e[1]-e[0])*(+e[7]||0),0);
  return {lancha:lan,viajes_sem:ev.length,horas_sem:h,disponible_sem:126,uso_pct:100*h/126,ocupacion_puestos_pct:h?100*ph/(cap*h):0};});
 // parámetros de cada día leídos del horario
 const P=m.plan.map(pl=>{const ev=[...lbEv(pl,'a').map(e=>[e,'a']),...lbEv(pl,'b').map(e=>[e,'b']),...lbEv(pl,'t').map(e=>[e,'b'])],nm=n=>ev.filter(x=>x[0][2]===n).map(x=>x[0]);
  const r=[...nm('Ronda mañana'),...nm('Ronda tarde')];
  return {mat:nm('Materiales').map(e=>+e[7]||0),rel:nm('Relevo TT').map(e=>+e[7]||0),ronda:r.length?Math.min(...r.map(e=>+e[7]||0))-10:null,
   med:ev.filter(x=>x[0][2]==='Ronda mediodía').map(x=>[+x[0][7]||0,x[1]==='a'?3:4])};});
 const V=LB_VIS.rows,srv=new Array(V.length).fill(-1);let cola=[];
 const cargar=(c,asi,mb,f,t)=>{const bs=new Set(),resto=[];let pe=0;
  c.forEach(i=>{const v=V[i];if(f(v)&&pe+v.p<=asi&&bs.size+v.z.filter(x=>!bs.has(x)).length<=mb){pe+=v.p;v.z.forEach(x=>bs.add(x));srv[i]=t;}else resto.push(i);});return resto;};
 for(let t=0;t<LB_VIS.dias;t++){const q=P[t%7];
  cola=cola.concat(LB_POR[t]||[]).sort((x,y)=>V[x].o-V[y].o||V[x].b-V[y].b);
  if(q.ronda!==null||q.med.length){cola.forEach(i=>{if(V[i].q===4)srv[i]=t;});cola=cola.filter(i=>V[i].q!==4);}   // traspaso entre barcazas: lo hace la lancha de la ronda (Yelko, 17 nov 2026)
  q.mat.forEach(c=>{cola=cargar(cola,c,5,v=>v.g||v.s,t);});
  q.rel.forEach(c=>{cola.forEach(i=>{if(V[i].d)srv[i]=t;});cola=cola.filter(i=>!V[i].d);cola=cargar(cola,Math.max(0,c-38),7,v=>!v.g,t);});
  if(q.ronda!==null)cola=cargar(cola,Math.max(0,q.ronda),6,v=>!v.g,t);
  q.med.forEach(([c,mb])=>{cola=cargar(cola,c,mb,v=>!v.g,t);});}
 const z=()=>({n:0,md:0,fin:0,esp:0,ped:0}),cnt=[z(),z(),z()],tot=z();

 V.forEach((v,i)=>{const a=cnt[v.b];let k;
  if(v.k)k='ped';else if(srv[i]<0)k='esp';else{const w=srv[i]-v.o;k=w===0?'md':(v.o%7>=5&&srv[i]%7===0&&w<=2?'fin':'esp');}
  [a,tot].forEach(x=>{x.n++;x[k]++;});sq[v.q].n++;if(k==='md'||k==='fin')sq[v.q].h++;if(k==='md')sq[v.q].md++;if(!v.k&&srv[i]>=0&&srv[i]-v.o<=2)sq[v.q].w2++;});
 const fila=(dem,tipo,x)=>({demanda:dem,tipo,mismo_dia:100*x.md/x.n,en_horario:100*(x.md+x.fin)/x.n,espera:100*x.esp/x.n,a_pedido:100*x.ped/x.n});

 const cob=[fijo('Relevos del Terminal','Línea base'),fila(LB_BL[0],'Línea base',cnt[0]),fila(LB_BL[1],'Línea base',cnt[1]),fila(LB_BL[2],'Variable',cnt[2]),
  fijo('Contratistas del Terminal','Variable',COB_CONT_MOTI),fila('Total TT','Total',tot)];
 // cuadro de cobertura por tarea (pedido de Yelko, 17 nov 2026): relevo, materiales y comida van en su bloque fijo (100%);
 // movimientos de tripulantes, traspasos de materiales y técnicos programables: % de sus visitas atendidas en horario en la simulación.
 const ph=q=>[sq[q].n?100*sq[q].md/sq[q].n:0,sq[q].n?100*sq[q].w2/sq[q].n:0];   // [solicitud del mismo día, calendarizada con 2 días de antelación]
 const cob2=[['Relevos MOTI',[100,100],'MOTI','Línea base'],['Contratistas MOTI',[COB_CONT_MOTI,COB_CONT_MOTI],'MOTI','Variable'],
